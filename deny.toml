# cargo-deny: advisories, licences, bans, sources. Run: cargo xtask deny
[advisories]
yanked = "deny"
# Unmaintained crates deep in the Typst stack (typstkit, the default `typst` feature) and the
# SVG text stack, with no fix upstream yet. presiterm only draws diagrams and fonts from its own
# deck and its own build, nothing attacker-facing.
ignore = [
    "RUSTSEC-2024-0320", # yaml-rust (typst -> syntect)
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0141", # bincode 1.x (typst -> syntect)
    "RUSTSEC-2026-0192", # ttf-parser unmaintained, successor skrifa
    "RUSTSEC-2026-0206", # rustybuzz unmaintained, successor harfrust
    "RUSTSEC-2026-0194", # quick-xml, trusted XML only
    "RUSTSEC-2026-0195", # quick-xml, trusted XML only
    "RUSTSEC-2024-0449", # unsafe-libyaml (typst)
    # zip (filmstrip's DOCX pass, docx-rs): the advisories concern extracting archives to disk
    # (SUID bits, symlink targets, permissions); filmstrip only reads and writes zip bytes in memory.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # zip < 9, reader side (AES entries without the MAC check, legacy decoders preallocating,
    # `ZipArchive::extract` symlinks, `ZipStreamReader` names): filmstrip only re-reads the .docx
    # docx-rs just wrote, in memory - no extract, AES or stream reader. docx-rs 0.4.22 (latest)
    # pins zip ^8; drop these once it allows zip 9.
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0546",
    "RUSTSEC-2026-0547",
    "RUSTSEC-2026-0548",
    "RUSTSEC-2026-0543", # chrono unmaintained (typst-as-lib), dates only, no successor upstream
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
